name: 活动内容检查

on:
  push:
    paths:
      - 'src/activity/**'
      - 'scripts/check-content.mjs'
  pull_request:
    paths:
      - 'src/activity/**'
      - 'scripts/check-content.mjs'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: npm install

      - run: node scripts/check-content.mjs
