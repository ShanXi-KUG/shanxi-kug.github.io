name: 依赖巡检

on:
  schedule:
    - cron: '23 4 1,16 * *'
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: npx --yes npm-check-updates -u && npm install

      # 构建不过就不开 PR
      - run: npm run build

      # 组织禁止默认令牌开 PR，改用组织令牌
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SHANXIKUG }}
          branch: chore/bump-deps
          delete-branch: true
          labels: dependencies
          commit-message: 'chore(deps): bump to latest.'
          title: 'chore(deps): bump to latest.'
          body: 半月一次的依赖巡检，已构建通过。
