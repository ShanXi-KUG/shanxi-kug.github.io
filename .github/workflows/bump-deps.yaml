name: 依赖巡检

on:
  schedule:
    - cron: '23 4 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # 大版本构建不过就只升次版本
      - id: bump
        run: |
          if npx --yes npm-check-updates -u && npm install && npm run build && node scripts/check-content.mjs; then
            echo "scope=全部升到最新" >> "$GITHUB_OUTPUT"
          else
            git checkout -- package.json
            npx --yes npm-check-updates -u --target minor
            npm install
            npm run build
            node scripts/check-content.mjs
            echo "scope=大版本升级后构建失败，本次只升次版本" >> "$GITHUB_OUTPUT"
          fi

      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/bump-deps
          delete-branch: true
          labels: dependencies
          commit-message: 'chore(deps): bump to latest.'
          title: 'chore(deps): bump to latest.'
          body: 半月一次的依赖巡检：${{ steps.bump.outputs.scope }}。构建与内容检查已通过，无冲突即自动合入。

      # 内置令牌的合入不会触发 push，部署得手动派发
      - if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} -R ${{ github.repository }} --squash --delete-branch --subject 'chore(deps): bump to latest.' --body ''
          gh workflow run build-and-publish-to-gh-page.yaml -R ${{ github.repository }} --ref main
